<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoonseok's Test Page</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      z-index: 0;
    }
    .bg-glow.one { background: var(--accent); top: -150px; left: -100px; }
    .bg-glow.two { background: var(--accent-2); bottom: -150px; right: -100px; }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 620px;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: rise 0.7s ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 14px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.lead {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .clock {
      font-size: 44px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .date { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

    .btn {
      cursor: pointer;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #0f172a;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(56, 189, 248, 0.35); }
    .btn:active { transform: translateY(0); }

    .quote {
      margin-top: 28px;
      min-height: 44px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      font-style: italic;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bg-glow one"></div>
  <div class="bg-glow two"></div>

  <div class="wrap">
    <div class="card">
      <span class="badge">GitHub Pages · Test</span>
      <h1>안녕하세요 👋</h1>
      <p class="lead">
        이 페이지는 GitHub Pages 배포 테스트를 위해 만들어졌어요.<br />
        아래 버튼을 눌러 오늘의 한마디를 받아보세요.
      </p>

      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date">&nbsp;</div>

      <button class="btn" id="quoteBtn">✨ 오늘의 한마디</button>
      <p class="quote" id="quote">&nbsp;</p>

      <footer>
        made with ☕ · <a href="https://github.com/yoonseokchoe" target="_blank" rel="noopener">github.com/yoonseokchoe</a>
      </footer>
    </div>
  </div>

  <script>
    const quotes = [
      "작은 커밋이 모여 큰 프로젝트가 됩니다.",
      "완벽함보다 배포가 낫다. — 일단 올려보세요!",
      "코드는 사람이 읽으라고 쓰는 것입니다.",
      "버그는 발견되는 순간 이미 반쯤 고쳐진 것.",
      "오늘의 실험이 내일의 서비스가 됩니다.",
      "가장 좋은 코드는 지워도 되는 코드입니다.",
      "천 리 길도 git init 부터."
    ];

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const now = new Date();
      document.getElementById("clock").textContent =
        pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      document.getElementById("date").textContent =
        now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 (" + days[now.getDay()] + ")";
    }
    tick();
    setInterval(tick, 1000);

    document.getElementById("quoteBtn").addEventListener("click", function () {
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      const el = document.getElementById("quote");
      el.style.opacity = 0;
      setTimeout(function () {
        el.textContent = "“" + q + "”";
        el.style.transition = "opacity 0.4s ease";
        el.style.opacity = 1;
      }, 150);
    });
  </script>
</body>
</html>
